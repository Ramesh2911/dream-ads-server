name: Fix and verify backend

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify files, trigger spawn, re-read logs
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -uo pipefail
          AUTH="Authorization: cpanel dreamads:${CPANEL_API_TOKEN}"
          BASE="https://server.shodns.in:2083"

          getfile() {
            local dir="$1" file="$2"
            local edir efile
            edir=$(printf '%s' "$dir" | jq -sRr @uri)
            efile=$(printf '%s' "$file" | jq -sRr @uri)
            curl -sS -H "$AUTH" "$BASE/execute/Fileman/get_file_content?dir=${edir}&file=${efile}"
          }

          echo "===== dist/server.js head ====="
          getfile /home/dreamads/backend/dist server.js | jq -r '.data.content // .errors // empty' | head -c 500
          echo
          echo "===== node_modules exists? ====="
          curl -sS -H "$AUTH" "$BASE/execute/Fileman/list_files?showhiddenfiles=1&dir=%2Fhome%2Fdreamads%2Fbackend%2Fnode_modules" | head -c 500
          echo
          echo "===== node_modules/express? ====="
          curl -sS -H "$AUTH" "$BASE/execute/Fileman/list_files?showhiddenfiles=1&dir=%2Fhome%2Fdreamads%2Fbackend%2Fnode_modules%2Fexpress" | head -c 300
          echo
          echo "===== .env exists? ====="
          getfile /home/dreamads/backend .env | jq -r 'if .status==1 then (.data.content | split("\n") | map(if test("SECRET|PASSWORD|URI|KEY") then (split("=")[0] + "=***") else . end) | join("\n")) else (.errors // empty) end'
          echo
          echo "===== Touch tmp/restart.txt again ====="
          curl -sS -H "$AUTH" -X POST "$BASE/execute/Fileman/save_file_content" \
            -F "dir=/home/dreamads/backend/tmp" -F "file=restart.txt" -F "content=" | jq -c '{status,errors}'
          echo
          echo "===== Trigger spawn via health requests ====="
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 15 "https://dreamads.in/api/health" || true)
            echo "req $i: http=$code $(head -c 120 /tmp/h.json 2>/dev/null)"
            sleep 3
          done
          echo
          echo "===== stderr.log after spawn attempts ====="
          getfile /home/dreamads/backend stderr.log | jq -r '.data.content // empty' | tail -c 4000
          echo
          echo "===== stderr.log mtime ====="
          curl -sS -H "$AUTH" "$BASE/execute/Fileman/list_files?showhiddenfiles=1&dir=%2Fhome%2Fdreamads%2Fbackend" | jq -r '.data[] | select(.file=="stderr.log") | {mtime,size,nicemode}'
          echo
          echo "===== Final health ====="
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/h2.json -w '%{http_code}' --max-time 15 "https://dreamads.in/api/health" || true)
            body=$(head -c 200 /tmp/h2.json 2>/dev/null)
            echo "final $i: http=$code $body"
            if [ "$code" = "200" ]; then echo "BACKEND UP"; exit 0; fi
            sleep 5
          done
          echo "STILL DOWN"
          exit 1
