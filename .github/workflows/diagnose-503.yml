name: Diagnose 503

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read logs, env, IP
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -uo pipefail
          AUTH="Authorization: cpanel dreamads:${CPANEL_API_TOKEN}"
          BASE="https://server.shodns.in:2083"

          getfile() {
            local dir="$1" file="$2"
            local edir efile
            edir=$(printf '%s' "$dir" | jq -sRr @uri)
            efile=$(printf '%s' "$file" | jq -sRr @uri)
            curl -sS -H "$AUTH" "$BASE/execute/Fileman/get_file_content?dir=${edir}&file=${efile}"
          }

          echo "===== SERVER PUBLIC IP ====="
          curl -sS --max-time 10 https://api.ipify.org || curl -sS --max-time 10 https://ifconfig.me || true
          echo

          echo "===== SERVER .env (full) ====="
          getfile /home/dreamads/backend .env > /tmp/env.json
          jq -r '.data.content // ((.errors // []) | tostring)' /tmp/env.json || true
          echo

          echo "===== stderr.log meta ====="
          curl -sS -H "$AUTH" "$BASE/execute/Fileman/list_files?showhiddenfiles=1&dir=%2Fhome%2Fdreamads%2Fbackend" \
            | jq -r '.data[] | select(.file=="stderr.log") | {mtime,size,nicemode}' || true
          echo

          echo "===== stderr.log tail ====="
          getfile /home/dreamads/backend stderr.log > /tmp/sl.json
          jq -r '.data.content // empty' /tmp/sl.json > /tmp/sl.txt 2>/dev/null || true
          tail -c 5000 /tmp/sl.txt || true
          echo

          echo "===== error_log in backend ====="
          for f in error_log error.log out.log nohup.out; do
            r=$(getfile /home/dreamads/backend "$f")
            if echo "$r" | grep -q '"status":1'; then
              echo "--- $f ---"
              echo "$r" | jq -r '.data.content // empty' | tail -c 3000 || true
              echo
            fi
          done

          echo "===== dist/server.js exists? ====="
          getfile /home/dreamads/backend/dist server.js > /tmp/sj.json
          jq -c '{status, len: (.data.content | length)}' /tmp/sj.json || true
          echo

          echo "===== node_modules express? ====="
          curl -sS -H "$AUTH" "$BASE/execute/Fileman/list_files?showhiddenfiles=1&dir=%2Fhome%2Fdreamads%2Fbackend%2Fnode_modules%2Fexpress" \
            | jq -c '{status, n: (.data | length)}' || true
          echo

          echo "===== LIVE HEALTH ====="
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 12 "https://dreamads.in/api/health" || echo 000)
            body=$(head -c 150 /tmp/h.json 2>/dev/null || true)
            echo "try $i: http=$code $body"
            sleep 2
          done
